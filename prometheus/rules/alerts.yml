groups:
  - name: infrastructure-alerts
    rules:
      - alert: HighCPUUsage
        expr: |
          100 * (
            1 - avg by (instance) (
              rate(node_cpu_seconds_total{mode="idle"}[5m])
            )
          ) > 80
        for: 5m
        labels:
           severity: warning
        annotations:
          summary: "High CPU utilization detected"
          description : "CPU utilization has exceeded 80% for more than 5 minutes."


      - alert: HighMemoryUsage
        expr: |
          100 * (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory utilization detected"
          description: "Memory utilization has exceeded 90% for more than 5 minutes"

      - alert: HighDiskUsage
        expr: |
          100 * (
            1 - 
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
            /
            node_flesystem_size_bytes{fstype!~"tmpfs|overlay"}
          ) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High filesystem utilization detected"
          description: "A monitored filesystem has exceeded 85% utlization."

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node Exporter is unreachable"
          description: "Prometheus cannot scrape the Node Exporter Target."

      - alert: HTTPEndpointDown
        expr: probe_success ==0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HTTP endpoint is down"
          description: "The HTTP probe for {{ $labels.instance }} has failed for more than 1 minute."

